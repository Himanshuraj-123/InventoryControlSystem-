
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Control System</title>
    <a href=""></a>

   
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>📦 Inventory</h2>

        <ul>
            <li class="active">Dashboard</li>
            <li>Products</li>
            <li>Stock Management</li>
            <li>Reports</li>
            <li>Settings</li>
        </ul>
    </aside>


    <!-- Main Content -->
    <main class="main">

        <div class="header">
            <div>
                <h1>Inventory Control System</h1>
                <p class="date" id="currentDate"></p>
            </div>

            <button class="add-btn" onclick="openModal()">
                + Add Product
            </button>
        </div>


        <!-- Dashboard Cards -->
        <section class="cards">

            <div class="card blue">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card green">
                <h3>Total Stock</h3>
                <p id="totalStock">0</p>
            </div>

            <div class="card orange">
                <h3>Low Stock</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="card red">
                <h3>Inventory Value</h3>
                <p id="inventoryValue">₹0</p>
            </div>

        </section>


        <!-- Product Table -->
        <section class="content-box">

            <div class="toolbar">

                <input type="text" id="searchInput" class="search" placeholder="Search product..." onkeyup="displayProducts()">

                <select id="categoryFilter" onchange="displayProducts()">
                    <option value="all">All Categories</option>
                </select>

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Add/Edit Modal -->
    <div class="modal" id="productModal">

        <div class="modal-content">

            <h2 id="modalTitle">Add Product</h2>

            <form id="productForm">

                <input type="hidden" id="productId">

                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required placeholder="Enter product name">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="productCategory" required placeholder="Enter category">
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="productPrice" min="0" step="0.01" required placeholder="Enter price">
                </div>

                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="productStock" min="0" required placeholder="Enter stock">
                </div>

                <div class="form-group">
                    <label>Minimum Stock Level</label>
                    <input type="number" id="minimumStock" min="0" value="5" required>
                </div>

                <div class="form-buttons">

                    <button type="button" class="cancel-btn" onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit" class="save-btn">
                        Save Product
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>
        /* -----------------------------
                   Sample Product Data
                ----------------------------- */

        let products = JSON.parse(
            localStorage.getItem("inventoryProducts")
        ) || [

            {
                id: 1,
                name: "Laptop",
                category: "Electronics",
                price: 55000,
                stock: 15,
                minStock: 5
            },

            {
                id: 2,
                name: "Wireless Mouse",
                category: "Electronics",
                price: 799,
                stock: 8,
                minStock: 10
            },

            {
                id: 3,
                name: "Office Chair",
                category: "Furniture",
                price: 6500,
                stock: 20,
                minStock: 5
            },

            {
                id: 4,
                name: "Notebook",
                category: "Stationery",
                price: 80,
                stock: 3,
                minStock: 5
            }

        ];


        /* -----------------------------
           Save Data
        ----------------------------- */

        function saveProducts() {

            localStorage.setItem(
                "inventoryProducts",
                JSON.stringify(products)
            );

        }


        /* -----------------------------
           Display Products
        ----------------------------- */

        function displayProducts() {

            const table = document.getElementById("productTable");

            const searchValue =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            const category =
                document.getElementById("categoryFilter").value;

            table.innerHTML = "";


            const filteredProducts = products.filter(product => {

                const matchesSearch =
                    product.name.toLowerCase()
                    .includes(searchValue);

                const matchesCategory =
                    category === "all" ||
                    product.category === category;

                return matchesSearch && matchesCategory;

            });


            filteredProducts.forEach(product => {

                let status = "";
                let statusClass = "";

                if (product.stock === 0) {

                    status = "Out of Stock";
                    statusClass = "out-stock";

                } else if (product.stock <= product.minStock) {

                    status = "Low Stock";
                    statusClass = "low-stock";

                } else {

                    status = "In Stock";
                    statusClass = "in-stock";

                }


                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>${product.id}</td>

                    <td>${product.name}</td>

                    <td>${product.category}</td>

                    <td>₹${product.price.toLocaleString()}</td>

                    <td>${product.stock}</td>

                    <td>
                        <span class="status ${statusClass}">
                            ${status}
                        </span>
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editProduct(${product.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${product.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(row);

            });


            updateDashboard();

        }


        /* -----------------------------
           Dashboard
        ----------------------------- */

        function updateDashboard() {

            const totalProducts = products.length;

            const totalStock =
                products.reduce(
                    (total, product) =>
                    total + Number(product.stock),
                    0
                );

            const lowStock =
                products.filter(
                    product =>
                    product.stock <= product.minStock
                ).length;

            const inventoryValue =
                products.reduce(
                    (total, product) =>
                    total +
                    Number(product.price) *
                    Number(product.stock),
                    0
                );


            document.getElementById("totalProducts")
                .textContent = totalProducts;

            document.getElementById("totalStock")
                .textContent = totalStock;

            document.getElementById("lowStock")
                .textContent = lowStock;

            document.getElementById("inventoryValue")
                .textContent =
                "₹" + inventoryValue.toLocaleString();

        }


        /* -----------------------------
           Open Modal
        ----------------------------- */

        function openModal() {

            document.getElementById("productModal")
                .style.display = "flex";

            document.getElementById("modalTitle")
                .textContent = "Add Product";

            document.getElementById("productForm")
                .reset();

            document.getElementById("productId")
                .value = "";

            document.getElementById("minimumStock")
                .value = 5;

        }


        /* -----------------------------
           Close Modal
        ----------------------------- */

        function closeModal() {

            document.getElementById("productModal")
                .style.display = "none";

        }


        /* -----------------------------
           Add / Update Product
        ----------------------------- */

        document.getElementById("productForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const id =
                    document.getElementById("productId").value;

                const name =
                    document.getElementById("productName").value;

                const category =
                    document.getElementById("productCategory").value;

                const price =
                    Number(
                        document.getElementById("productPrice").value
                    );

                const stock =
                    Number(
                        document.getElementById("productStock").value
                    );

                const minStock =
                    Number(
                        document.getElementById("minimumStock").value
                    );


                if (id) {

                    const product =
                        products.find(
                            product =>
                            product.id === Number(id)
                        );

                    product.name = name;
                    product.category = category;
                    product.price = price;
                    product.stock = stock;
                    product.minStock = minStock;

                } else {

                    const newProduct = {

                        id: products.length > 0 ?
                            Math.max(
                                ...products.map(
                                    product => product.id
                                )
                            ) + 1 :
                            1,

                        name: name,
                        category: category,
                        price: price,
                        stock: stock,
                        minStock: minStock

                    };

                    products.push(newProduct);

                }


                saveProducts();

                updateCategories();

                displayProducts();

                closeModal();

            });


        /* -----------------------------
           Edit Product
        ----------------------------- */

        function editProduct(id) {

            const product =
                products.find(
                    product => product.id === id
                );

            if (!product) return;


            document.getElementById("productModal")
                .style.display = "flex";

            document.getElementById("modalTitle")
                .textContent = "Edit Product";

            document.getElementById("productId")
                .value = product.id;

            document.getElementById("productName")
                .value = product.name;

            document.getElementById("productCategory")
                .value = product.category;

            document.getElementById("productPrice")
                .value = product.price;

            document.getElementById("productStock")
                .value = product.stock;

            document.getElementById("minimumStock")
                .value = product.minStock;

        }


        /* -----------------------------
           Delete Product
        ----------------------------- */

        function deleteProduct(id) {

            const product =
                products.find(
                    product => product.id === id
                );

            if (!product) return;


            const confirmDelete =
                confirm(
                    `Are you sure you want to delete "${product.name}"?`
                );


            if (!confirmDelete) return;


            products =
                products.filter(
                    product => product.id !== id
                );


            saveProducts();

            updateCategories();

            displayProducts();

        }


        /* -----------------------------
           Category Filter
        ----------------------------- */

        function updateCategories() {

            const select =
                document.getElementById("categoryFilter");

            const currentValue = select.value;

            const categories = [...new Set(
                products.map(
                    product => product.category
                )
            )];


            select.innerHTML =
                `<option value="all">All Categories</option>`;


            categories.forEach(category => {

                const option =
                    document.createElement("option");

                option.value = category;
                option.textContent = category;

                select.appendChild(option);

            });


            if (
                categories.includes(currentValue)
            ) {
                select.value = currentValue;
            }

        }


        /* -----------------------------
           Current Date
        ----------------------------- */

        function displayDate() {

            const today = new Date();

            document.getElementById("currentDate")
                .textContent =
                today.toLocaleDateString(
                    "en-IN", {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );

        }


        /* -----------------------------
           Close Modal When Clicking Outside
        ----------------------------- */

        window.addEventListener("click", function(event) {

            const modal =
                document.getElementById("productModal");

            if (event.target === modal) {
                closeModal();
            }

        });


        /* -----------------------------
           Initialize Application
        ----------------------------- */

        updateCategories();

        displayProducts();

        displayDate();
    </script>

</body>

</html>
